name: iOS build workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      # Pick a concrete simulator and pin the destination to its UDID.
      #
      # This used to grep a device *name* out of `xctrace list devices` and pass
      # it as `name=...`, which xcodebuild resolves against `OS:latest`. Runner
      # images carry several runtimes and not every device exists on the newest
      # one, so the first iPhone by name (iPhone 16e, only on 26.2) could not be
      # matched at latest (26.5) and the build failed before compiling anything.
      # A UDID is unambiguous, and taking the newest runtime keeps this working
      # as the deployment target moves forward.
      - name: Select simulator
        run: |
          simulator=$(xcrun simctl list devices available --json | ruby -rjson -e '
            data = JSON.parse(STDIN.read)["devices"]
            candidates = data.flat_map do |runtime, devices|
              next [] unless runtime.include?("SimRuntime.iOS-")
              version = runtime[/iOS-([\d-]+)/, 1].split("-").map(&:to_i)
              devices.select { |d| d["isAvailable"] && d["name"].start_with?("iPhone") }
                     .map { |d| [version, d] }
            end
            abort("No available iPhone simulator") if candidates.empty?
            version, device = candidates.max_by { |v, _| v }
            puts "#{device["udid"]}\t#{device["name"]}\tiOS #{version.join(".")}"
          ')
          echo "SIMULATOR_ID=$(echo "$simulator" | cut -f1)" >> "$GITHUB_ENV"
          echo "Using $(echo "$simulator" | cut -f2) ($(echo "$simulator" | cut -f3))"
      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "id=$SIMULATOR_ID"
      - name: Test
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "id=$SIMULATOR_ID"
